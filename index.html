
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Chetan Arts Gallery</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
  color: #222;
}

header {
  background: #171717;
  color: white;
  text-align: center;
  padding: 22px 12px;
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 1px;
}

header p {
  margin: 7px 0 0;
  color: #ddd;
  font-size: 14px;
}

#status {
  text-align: center;
  padding: 16px 8px;
  color: #555;
  font-size: 14px;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  justify-content: center;
}

@media (min-width: 700px) {
  #gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding: 18px;
  }
}

.photo-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 7px #00000018;
}

.photo {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  cursor: pointer;
  background: #ddd;
}

.photo-name {
  padding: 9px;
  font-size: 12px;
  overflow-wrap: anywhere;
  color: #444;
}

#viewer {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  padding: 16px;
}

#large {
  max-width: 100%;
  max-height: 88vh;
  object-fit: contain;
}

#close {
  position: absolute;
  top: 10px;
  right: 15px;
  border: 0;
  color: white;
  background: transparent;
  font-size: 38px;
  cursor: pointer;
}

footer {
  padding: 18px;
  text-align: center;
  color: #777;
  font-size: 12px;
}

@media (min-width: 700px) {
  #gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding: 16px;
  }
}
</style>
</head>

<body>
<header>
  
<section id="admin" style="max-width:500px;margin:20px auto;padding:16px;background:white;border-radius:12px;color:#111">
  <h2>Admin Login</h2>
  <label for="adminEmail">Admin Email</label>
  <input id="adminEmail" type="email" placeholder="Admin email" style="display:block;width:95%;padding:10px;margin:8px 0">
  <label for="adminPassword">Password</label>
  <input id="adminPassword" type="password" placeholder="Password" style="display:block;width:95%;padding:10px;margin:8px 0">
  <button id="loginButton">Admin Login</button>
  <div id="uploadPanel" hidden>
    <h3>Photo Upload</h3>
    <input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    <button id="uploadButton">Upload Photo</button>
    <button id="logoutButton">Logout</button>
  </div>
  <p id="adminMessage"></p>
</section>

  <h1>Chetan Arts</h1>
  <p>Creative Designs • Photo Gallery</p>
</header>

<div id="status">ફોટા લોડ થઈ રહ્યા છે...</div>
<main id="gallery"></main>

<div id="viewer" role="dialog" aria-label="મોટો ફોટો">
  <button id="close" aria-label="બંધ કરો">&times;</button>
  <img id="large" alt="Chetan Arts Photo">
</div>

<footer>Chetan Arts Gallery</footer>

<script>
const gallery = document.getElementById('gallery');
const status = document.getElementById('status');
const viewer = document.getElementById('viewer');
const large = document.getElementById('large');

async function loadGallery() {
  try {
    const response = await fetch('./gallery.json');
    if (!response.ok) throw new Error('Gallery file not found');

    const photos = await response.json();
    gallery.replaceChildren();

    let count = 0;

    photos.forEach(photo => {
      if (!photo.url) return;

      const card = document.createElement('article');
      card.className = 'photo-card';

      const img = document.createElement('img');
      img.className = 'photo';
      img.src = photo.url;
      img.alt = photo.name || 'Chetan Arts photo';
      img.loading = 'lazy';

      img.onerror = () => {
        card.remove();
        count--;
        status.textContent = count + ' ફોટા';
      };

      img.onclick = () => {
        large.src = photo.url;
        viewer.style.display = 'flex';
      };

      const name = document.createElement('div');
      name.className = 'photo-name';
      name.textContent = photo.name || 'Chetan Arts';

      card.append(img, name);
      gallery.appendChild(card);
      count++;
    });

    status.textContent = count
      ? count + ' ફોટા ઉપલબ્ધ'
      : 'હજુ કોઈ ફોટો ઉપલબ્ધ નથી';
  } catch (error) {
    status.textContent = 'ફોટા લોડ થયા નથી. ઇન્ટરનેટ તપાસો.';
  }
}

function closeViewer() {
  viewer.style.display = 'none';
  large.src = '';
}

document.getElementById('close').onclick = closeViewer;

viewer.onclick = event => {
  if (event.target === viewer) closeViewer();
};

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeViewer();
});

loadGallery();

const API_BASE = "https://chetan-arts-api.aryanjethava7.workers.dev";
let adminToken = null;

const msg = document.getElementById("adminMessage");
const panel = document.getElementById("uploadPanel");

document.getElementById("loginButton").onclick = async () => {
  msg.textContent = "Login થઈ રહ્યું છે...";
  try {
    const r = await fetch(API_BASE + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("adminEmail").value,
        password: document.getElementById("adminPassword").value
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Login નિષ્ફળ થયું");

    adminToken = data.token;
    panel.hidden = false;
    document.getElementById("adminPassword").value = "";
    msg.textContent = "Login સફળ થયું!";
  } catch (e) {
    msg.textContent = "ભૂલ: " + e.message;
  }
};

document.getElementById("uploadButton").onclick = async () => {
  const file = document.getElementById("photoFile").files[0];
  if (!adminToken) {
    msg.textContent = "પહેલાં Login કરો.";
    return;
  }
  if (!file) {
    msg.textContent = "પહેલાં ફોટો પસંદ કરો.";
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    msg.textContent = "ફોટો 5 MBથી નાનો હોવો જોઈએ.";
    return;
  }

  msg.textContent = "ફોટો અપલોડ થઈ રહ્યો છે...";
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const r = await fetch(API_BASE + "/api/upload", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + adminToken
      },
      body: JSON.stringify({ contentType: file.type, base64 })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Upload નિષ્ફળ થયું");

    msg.textContent = "ફોટો સફળતાપૂર્વક અપલોડ થયો!";
    document.getElementById("photoFile").value = "";
    if (typeof loadGallery === "function") await loadGallery();
  } catch (e) {
    msg.textContent = "ભૂલ: " + e.message;
  }
};

document.getElementById("logoutButton").onclick = () => {
  adminToken = null;
  panel.hidden = true;
  msg.textContent = "Logout થયું.";
};

</script>
</body>
</html>
